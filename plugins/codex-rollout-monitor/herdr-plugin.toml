id = "herdr.codex-rollout-monitor"
name = "Codex rollout monitor"
version = "0.1.0"
min_herdr_version = "0.7.11"
description = "Reports live Codex rollout activity and suspected stalls to Herdr."
platforms = ["linux", "macos"]

[[services]]
id = "monitor"
command = ["python3", "monitor.py"]
restart = "always"

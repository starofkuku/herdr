name: Nix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/nix.yml"
      - "assets/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "vendor/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/nix.yml"
      - "assets/**"
      - "build.rs"
      - "Cargo.lock"
      - "Cargo.toml"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          # crates.io rejects requests whose user agent identifies as curl, and
          # nixpkgs' fetchurl hardcodes `--user-agent "curl/<ver> Nixpkgs/<ver>"`,
          # so crates missing from cache.nixos.org cannot be downloaded and the
          # flake check never finishes. Under the multi-user daemon a plain step
          # env var does not reach the builder, so the override goes through
          # impure-env, which is trusted-user scoped (install-nix-action sets
          # set_as_trusted_user). `-A<ua>` has no spaces because impure-env is
          # a whitespace-separated list.
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true
            extra-experimental-features = configurable-impure-env
            impure-env = NIX_CURL_FLAGS=-Aherdr-ci

      - name: Run Nix flake check
        run: |
          nix flake check --print-build-logs
          nix flake check --all-systems --no-build --print-build-logs
